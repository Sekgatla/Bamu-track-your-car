<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bamu — Trips</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/bamu.css">
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-name">Bamu</div>
        <div class="brand-tagline">Vehicle Tracking</div>
      </div>
      <div class="sidebar-greeting">
        Welcome back,
        <strong id="sidebar-user-name">—</strong>
      </div>
      <nav class="sidebar-nav">
        <a href="./dashboard.html">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="./map.html">
          <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          Live Map
        </a>
        <a href="./trips.html" class="active">
          <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Trips
        </a>
        <a href="./alerts.html">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Alerts
          <span id="alerts-nav-badge" class="nav-badge" style="display:none">0</span>
        </a>
        <a href="./profile.html">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <h1>Trip History</h1>
        <p>All recorded journeys for your vehicle</p>
      </div>
      <div id="trips-container">
        <div class="trips-list" id="trips-list"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import './src/js/auth.js';
    import { getSession, getTripsByVehicle, getVehicleById } from './src/js/storage.js';

    function formatDateTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' })
        + ' ' + d.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDuration(startIso, endIso) {
      if (!startIso || !endIso) return '—';
      const diffMs = new Date(endIso) - new Date(startIso);
      const mins = Math.round(diffMs / 60000);
      if (mins < 60) return `${mins} min`;
      const hrs = Math.floor(mins / 60);
      const rem = mins % 60;
      return rem > 0 ? `${hrs}h ${rem}m` : `${hrs}h`;
    }

    function formatCoords(lat, lng) {
      return `${Math.abs(lat).toFixed(4)}°${lat < 0 ? 'S' : 'N'}, ${Math.abs(lng).toFixed(4)}°${lng < 0 ? 'W' : 'E'}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const session = JSON.parse(localStorage.getItem('bamu_session') || 'null');
      if (!session) return;

      const vehicle = getVehicleById(session.vehicleId);
      const trips = vehicle ? getTripsByVehicle(vehicle.id) : [];

      // Sort newest first
      trips.sort((a, b) => new Date(b.startTime) - new Date(a.startTime));

      const list = document.getElementById('trips-list');

      if (trips.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <h3>No trips recorded yet</h3>
            <p>Your trip history will appear here once your vehicle starts moving.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = trips.map((trip, i) => `
        <div class="trip-card">
          <div class="trip-card-header">
            <div>
              <div class="trip-number">Trip #${trips.length - i}</div>
              <div class="trip-route">${formatDateTime(trip.startTime)}</div>
            </div>
            <div class="trip-badges">
              <span class="badge badge-info">${trip.distance} km</span>
              <span class="badge badge-warning">${trip.maxSpeed} km/h max</span>
            </div>
          </div>
          <div class="trip-meta">
            <span>
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Duration: ${formatDuration(trip.startTime, trip.endTime)}
            </span>
            <span>
              <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              Avg: ${trip.avgSpeed} km/h
            </span>
            <span>
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
              End: ${formatDateTime(trip.endTime)}
            </span>
          </div>
          <div style="margin-top:10px;font-size:12px;color:var(--text-muted);">
            <span style="margin-right:16px;">📍 From: ${formatCoords(trip.startLat, trip.startLng)}</span>
            <span>🏁 To: ${formatCoords(trip.endLat, trip.endLng)}</span>
          </div>
        </div>
      `).join('');

      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('bamu_session');
        window.location.href = './index.html';
      });
    });
  </script>
</body>
</html>
