<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bamu — Profile</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/bamu.css">
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-name">Bamu</div>
        <div class="brand-tagline">Vehicle Tracking</div>
      </div>
      <div class="sidebar-greeting">
        Welcome back,
        <strong id="sidebar-user-name">—</strong>
      </div>
      <nav class="sidebar-nav">
        <a href="./dashboard.html">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="./map.html">
          <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          Live Map
        </a>
        <a href="./trips.html">
          <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Trips
        </a>
        <a href="./alerts.html">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Alerts
          <span id="alerts-nav-badge" class="nav-badge" style="display:none">0</span>
        </a>
        <a href="./profile.html" class="active">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <h1>My Profile</h1>
        <p>Your account and vehicle information</p>
      </div>

      <div style="max-width:600px;display:flex;flex-direction:column;gap:20px;">
        <!-- Customer Info -->
        <div class="card" id="customer-card">
          <div class="profile-header">
            <div class="profile-avatar" id="profile-avatar">T</div>
            <div>
              <div class="profile-name" id="profile-name">—</div>
              <div class="profile-email" id="profile-email">—</div>
            </div>
          </div>
          <div id="customer-info-rows">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Vehicle Info -->
        <div class="card" id="vehicle-card">
          <div class="card-header">
            <h2>
              <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--primary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-right:6px;"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
              Linked Vehicle
            </h2>
          </div>
          <div id="vehicle-info-rows">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Logout Button -->
        <button id="logout-full-btn" class="btn btn-danger" style="align-self:flex-start;">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </main>
  </div>

  <script type="module">
    import './src/js/auth.js';
    import { getSession, findCustomerById, getVehicleById, getTrackerById } from './src/js/storage.js';

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('en-ZA', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const session = JSON.parse(localStorage.getItem('bamu_session') || 'null');
      if (!session) return;

      const customer = findCustomerById(session.customerId);
      const vehicle = customer?.vehicleId ? getVehicleById(customer.vehicleId) : null;
      const tracker = vehicle?.trackerId ? getTrackerById(vehicle.trackerId) : null;

      if (customer) {
        const initials = customer.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        document.getElementById('profile-avatar').textContent = initials;
        document.getElementById('profile-name').textContent = customer.name;
        document.getElementById('profile-email').textContent = customer.email;

        document.getElementById('customer-info-rows').innerHTML = `
          <div class="info-row">
            <span class="label">Full Name</span>
            <span class="value">${customer.name}</span>
          </div>
          <div class="info-row">
            <span class="label">Email</span>
            <span class="value">${customer.email}</span>
          </div>
          <div class="info-row">
            <span class="label">Phone</span>
            <span class="value">${customer.phone || '—'}</span>
          </div>
          <div class="info-row">
            <span class="label">Customer Since</span>
            <span class="value">${formatDate(customer.createdAt)}</span>
          </div>
          <div class="info-row">
            <span class="label">Customer ID</span>
            <span class="value" style="font-family:monospace;font-size:13px;">${customer.id}</span>
          </div>
        `;
      }

      if (vehicle) {
        const statusColors = { parked: 'badge-success', moving: 'badge-info', alert: 'badge-danger', offline: 'badge-muted' };
        document.getElementById('vehicle-info-rows').innerHTML = `
          <div class="info-row">
            <span class="label">Make & Model</span>
            <span class="value">${vehicle.make} ${vehicle.model} ${vehicle.year}</span>
          </div>
          <div class="info-row">
            <span class="label">License Plate</span>
            <span class="value" style="font-family:monospace;font-weight:700;letter-spacing:1px;">${vehicle.plate}</span>
          </div>
          <div class="info-row">
            <span class="label">Color</span>
            <span class="value">${vehicle.color}</span>
          </div>
          <div class="info-row">
            <span class="label">Status</span>
            <span class="value"><span class="badge ${statusColors[vehicle.status] || 'badge-muted'}">${vehicle.status.charAt(0).toUpperCase() + vehicle.status.slice(1)}</span></span>
          </div>
          <div class="info-row">
            <span class="label">Odometer</span>
            <span class="value">${vehicle.odometer ? vehicle.odometer.toLocaleString() : '—'} km</span>
          </div>
          ${tracker ? `
          <div class="info-row">
            <span class="label">Tracker</span>
            <span class="value"><span class="tracker-brand-badge" style="font-size:12px;">${tracker.brand}</span> <span style="font-family:monospace;font-size:13px;margin-left:6px;">${tracker.serialNumber}</span></span>
          </div>
          ` : ''}
          <div class="info-row">
            <span class="label">Vehicle ID</span>
            <span class="value" style="font-family:monospace;font-size:13px;">${vehicle.id}</span>
          </div>
        `;
      } else {
        document.getElementById('vehicle-info-rows').innerHTML = `
          <p style="color:var(--text-muted);font-size:14px;padding:8px 0;">No vehicle linked to your account. Contact your Bamu provider.</p>
        `;
      }

      const doLogout = () => {
        localStorage.removeItem('bamu_session');
        window.location.href = './index.html';
      };

      document.getElementById('logout-btn').addEventListener('click', doLogout);
      document.getElementById('logout-full-btn').addEventListener('click', doLogout);
    });
  </script>
</body>
</html>
