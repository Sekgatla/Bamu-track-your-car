<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bamu — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/bamu.css">
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-name">Bamu</div>
        <div class="brand-tagline">Vehicle Tracking</div>
      </div>
      <div class="sidebar-greeting">
        Welcome back,
        <strong id="sidebar-user-name">—</strong>
      </div>
      <nav class="sidebar-nav">
        <a href="./dashboard.html" class="active">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="./map.html">
          <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          Live Map
        </a>
        <a href="./trips.html">
          <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Trips
        </a>
        <a href="./alerts.html">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Alerts
          <span id="alerts-nav-badge" class="nav-badge" style="display:none">0</span>
        </a>
        <a href="./profile.html">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <h1>Dashboard</h1>
        <p>Your vehicle status at a glance</p>
      </div>

      <!-- Vehicle Status Card -->
      <div id="vehicle-status-section">
        <!-- Populated by JS -->
      </div>

      <!-- Bottom Cards Grid -->
      <div class="dashboard-grid" id="bottom-cards">
        <!-- Populated by JS -->
      </div>
    </main>
  </div>

  <script type="module">
    import './src/js/auth.js';
    import { getSession, getVehicleById, getTrackerById, getAlertsByVehicle } from './src/js/storage.js';

    function formatRelativeTime(iso) {
      if (!iso) return 'Never';
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'Just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function getBatteryClass(pct) {
      if (pct >= 50) return 'high';
      if (pct >= 20) return 'mid';
      return 'low';
    }

    function getStatusBadge(status) {
      const map = {
        parked: ['badge-success', '⬤ Parked'],
        moving: ['badge-info', '⬤ Moving'],
        alert: ['badge-danger', '⬤ Alert'],
        offline: ['badge-muted', '⬤ Offline'],
      };
      const [cls, label] = map[status] || ['badge-muted', status];
      return `<span class="badge ${cls}">${label}</span>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const session = JSON.parse(localStorage.getItem('bamu_session') || 'null');
      if (!session) return;

      const vehicle = getVehicleById(session.vehicleId);
      const tracker = vehicle?.trackerId ? getTrackerById(vehicle.trackerId) : null;
      const alerts = vehicle ? getAlertsByVehicle(vehicle.id) : [];
      const unreadAlerts = alerts.filter(a => !a.read).length;

      const statusSection = document.getElementById('vehicle-status-section');
      const bottomCards = document.getElementById('bottom-cards');

      if (!vehicle) {
        statusSection.innerHTML = `
          <div class="card" style="text-align:center;padding:40px;">
            <p style="color:var(--text-muted);font-size:15px;">No vehicle linked to your account. Contact your Bamu provider.</p>
          </div>
        `;
        return;
      }

      const battPct = vehicle.battery || 0;
      const battClass = getBatteryClass(battPct);

      statusSection.innerHTML = `
        <div class="vehicle-status-card">
          <div class="vehicle-status-top">
            <div>
              <div class="vehicle-make-model">${vehicle.make} ${vehicle.model} <span style="font-size:15px;font-weight:500;color:var(--text-muted)">${vehicle.year}</span></div>
              <div class="vehicle-plate">${vehicle.plate} &bull; ${vehicle.color}</div>
              <div style="margin-top:10px;">${getStatusBadge(vehicle.status)}</div>
            </div>
            <div class="speed-display">
              <div class="speed-num">${vehicle.speed}</div>
              <div class="speed-unit">km/h</div>
            </div>
          </div>
          <div class="last-seen-row">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Last seen: ${formatRelativeTime(vehicle.lastSeen)}
            &nbsp;&bull;&nbsp;
            <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            Odometer: ${vehicle.odometer ? vehicle.odometer.toLocaleString() : '—'} km
          </div>
          <a href="./map.html" class="view-map-btn">
            <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            View on Map
          </a>
        </div>
      `;

      bottomCards.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:16px;">
          <!-- Battery Card -->
          <div class="card">
            <div class="card-header">
              <h2>Battery Level</h2>
              <span style="font-size:22px;">🔋</span>
            </div>
            <div class="battery-bar-wrap">
              <div class="battery-bar-label">
                <span>Tracker battery</span>
                <span>${battPct}%</span>
              </div>
              <div class="battery-bar-track">
                <div class="battery-bar-fill ${battClass}" style="width:${battPct}%"></div>
              </div>
            </div>
            <div style="margin-top:12px;font-size:13px;color:var(--text-muted);">
              ${battPct >= 50 ? 'Battery in good condition.' : battPct >= 20 ? 'Battery getting low.' : 'Battery critically low — charge soon.'}
            </div>
          </div>

          <!-- Alerts Card -->
          <div class="card">
            <div class="card-header">
              <h2>Active Alerts</h2>
              ${unreadAlerts > 0 ? `<span class="badge badge-danger">${unreadAlerts} unread</span>` : `<span class="badge badge-success">All clear</span>`}
            </div>
            <p style="font-size:14px;color:var(--text-muted);">${unreadAlerts > 0 ? `You have ${unreadAlerts} unread alert${unreadAlerts > 1 ? 's' : ''} requiring attention.` : 'No unread alerts at this time.'}</p>
            <a href="./alerts.html" class="btn btn-ghost" style="margin-top:10px;padding-left:0;">View all alerts →</a>
          </div>
        </div>

        <!-- Tracker Info Card -->
        <div class="card" style="align-self:start;">
          <div class="card-header">
            <h2>Tracker Info</h2>
          </div>
          ${tracker ? `
            <div class="tracker-info">
              <div class="tracker-brand-row">
                <div class="tracker-brand-badge">${tracker.brand}</div>
                <div class="tracker-serial">${tracker.serialNumber}</div>
              </div>
              <div class="info-row">
                <span class="label">Status</span>
                <span class="value">
                  <span class="badge ${tracker.status === 'active' ? 'badge-success' : tracker.status === 'offline' ? 'badge-muted' : 'badge-warning'}">
                    ${tracker.status.charAt(0).toUpperCase() + tracker.status.slice(1)}
                  </span>
                </span>
              </div>
              <div class="info-row">
                <span class="label">Battery</span>
                <span class="value">${tracker.battery}%</span>
              </div>
              <div class="info-row">
                <span class="label">Last Ping</span>
                <span class="value">${formatRelativeTime(tracker.lastPing)}</span>
              </div>
              <div class="info-row" style="border:none;">
                <span class="label">Tracker ID</span>
                <span class="value" style="font-family:monospace;font-size:12px;">${tracker.id}</span>
              </div>
            </div>
          ` : `<p style="color:var(--text-muted);font-size:14px;">No tracker assigned to this vehicle.</p>`}
        </div>
      `;

      // Logout
      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('bamu_session');
        window.location.href = './index.html';
      });
    });
  </script>
</body>
</html>
